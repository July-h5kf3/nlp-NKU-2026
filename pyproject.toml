[project]
name = "nlp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "gensim>=4.4.0",
    "huggingface-hub>=1.33.0",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "torch>=2.11.0",
    "transformers>=5.17.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
